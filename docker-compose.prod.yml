# ==============================================================================
# ReliefChain AI — Production Docker Compose (3-Tier Architecture)
# Reverse Proxy (Nginx) -> Application (FastAPI) -> Database (PostgreSQL 16)
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Tier 1: Nginx Edge Reverse Proxy & TLS Termination
  # ----------------------------------------------------------------------------
  proxy:
    image: nginx:1.25-alpine
    container_name: reliefchain-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend:/usr/share/nginx/html/frontend:ro
      - uploads_data:/usr/share/nginx/html/uploads:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - reliefchain-public-net
      - reliefchain-internal-net

  # ----------------------------------------------------------------------------
  # Tier 2: FastAPI Application Backend & AI Decision Support Engine
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reliefchain-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      HOST: "0.0.0.0"
      PORT: 8000
      WORKERS: ${WORKERS:-4}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-reliefchain}:${POSTGRES_PASSWORD:-reliefchain_prod_secure_pass_2026}@db:5432/${POSTGRES_DB:-reliefchain}
      SECRET_KEY: ${SECRET_KEY:-reliefchain-prod-super-secure-key-2026-xyz123}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost,https://reliefchain.org}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,proxy}
      RATE_LIMIT_ENABLED: "True"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      AI_MODEL_PATH: ai/model/priority_classifier.joblib
      STORAGE_LOCAL_DIR: /app/uploads/evidence
      MAX_UPLOAD_SIZE_MB: 10
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - reliefchain-internal-net

  # ----------------------------------------------------------------------------
  # Tier 3: PostgreSQL 16 Relational Database Engine (Private Internal Network)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: reliefchain-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reliefchain}
      POSTGRES_USER: ${POSTGRES_USER:-reliefchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reliefchain_prod_secure_pass_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reliefchain} -d ${POSTGRES_DB:-reliefchain}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - reliefchain-internal-net

networks:
  reliefchain-public-net:
    driver: bridge
  reliefchain-internal-net:
    driver: bridge
    internal: false

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  nginx_logs:
    driver: local
