# ==============================================================================
# ReliefChain AI - Production Full-Stack Docker Compose
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Relational Database Engine
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: reliefchain-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reliefchain}
      POSTGRES_USER: ${POSTGRES_USER:-reliefchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reliefchain_secure_password_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reliefchain} -d ${POSTGRES_DB:-reliefchain}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - reliefchain-net

  # ----------------------------------------------------------------------------
  # FastAPI Application Backend & AI Engine
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reliefchain-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      HOST: "0.0.0.0"
      PORT: 8000
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-reliefchain}:${POSTGRES_PASSWORD:-reliefchain_secure_password_2026}@db:5432/${POSTGRES_DB:-reliefchain}
      SECRET_KEY: ${SECRET_KEY:-reliefchain-prod-super-secure-key-2026-xyz123}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:8000,http://localhost:3000,http://127.0.0.1:8000}
      RATE_LIMIT_ENABLED: "True"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      AI_MODEL_PATH: ai/model/priority_classifier.joblib
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - reliefchain-net

networks:
  reliefchain-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
