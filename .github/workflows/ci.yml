name: ReliefChain AI - Production CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-quality:
    name: Build, Lint & Automated Test Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r backend/requirements.txt
          python -m pip install ruff pytest-cov

      - name: Run Code Quality Checks (Ruff)
        run: |
          ruff check . --config pyproject.toml

      - name: Run Database Migration Verification
        working-directory: ./backend
        env:
          DATABASE_URL: "sqlite:///./test_ci.db"
          ENVIRONMENT: "testing"
          SECRET_KEY: "test-ci-super-secret-key-32-chars-long-abc"
        run: |
          python -m alembic upgrade head

      - name: Execute Automated Test Suite (Pytest)
        env:
          DATABASE_URL: "sqlite:///:memory:"
          ENVIRONMENT: "testing"
          SECRET_KEY: "test-ci-super-secret-key-32-chars-long-abc"
          AI_MODEL_PATH: "ai/model/priority_classifier.joblib"
          RATE_LIMIT_ENABLED: "False"
        run: |
          python -m pytest backend/tests -v --tb=short

      - name: Validate Docker Configuration Syntax
        run: |
          docker compose config -q
