# ==============================================================================
# ReliefChain AI - Development Docker Compose with Live Reload & Volumes
# Run with: docker compose -f docker-compose.dev.yml up --build
# ==============================================================================

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: reliefchain-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: reliefchain_dev
      POSTGRES_USER: reliefchain
      POSTGRES_PASSWORD: dev_password_123
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reliefchain -d reliefchain_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - reliefchain-dev-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reliefchain-backend-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./ai:/app/ai
      - ./frontend:/app/frontend
    environment:
      ENVIRONMENT: development
      DEBUG: "True"
      DATABASE_URL: postgresql+psycopg2://reliefchain:dev_password_123@db:5432/reliefchain_dev
      SECRET_KEY: reliefchain-dev-super-secret-key-change-in-production-12345
      BACKEND_CORS_ORIGINS: "http://localhost:8000,http://localhost:3000,http://127.0.0.1:8000,http://localhost:5173"
      RATE_LIMIT_ENABLED: "True"
      LOG_LEVEL: DEBUG
      LOG_FORMAT: standard
    ports:
      - "8000:8000"
    command: ["python", "-m", "uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - reliefchain-dev-net

networks:
  reliefchain-dev-net:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local
